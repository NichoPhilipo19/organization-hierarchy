name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome check .

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit

  test:
    name: Test (Vitest + coverage)
    runs-on: ubuntu-latest
    # checks/pull-requests write: for the two reporting steps below. Only meaningful
    # on same-repo PRs — a fork PR's GITHUB_TOKEN is read-only regardless of this block,
    # so both steps just no-op there instead of failing (fine for a solo-maintained repo).
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

      - name: Annotate failed tests on the PR
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: junit.xml
          reporter: java-junit

      - name: Comment coverage report on the PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'

  build:
    name: Build (demo, lib, stories)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vite build

      - run: pnpm build:lib

      - run: pnpm story:build
