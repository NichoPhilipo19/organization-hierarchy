name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commit format
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches the commit types allowed by CONTRIBUTING.md / .claude/CLAUDE.md —
          # squash-merge uses this exact title as main's commit message.
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: 'The PR title''s subject (after "type: ") must start lowercase, matching this repo''s commit message convention.'
